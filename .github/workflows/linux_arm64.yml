name: Build for Linux arm64

on:
  workflow_call:
    inputs:
      tag:
        description: "tag"
        required: false
        default: ""
        type: string
  workflow_dispatch:

jobs:
  build-linux-app:
    name: Release Linux arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev webkit2gtk-4.1 libasound2-dev libmpv-dev elfutils
        shell: bash

      - name: Setup flutter
        run: |
          git clone --depth 1 --branch 3.38.3 https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$HOME/flutter" >> "$GITHUB_ENV"
          "$HOME/flutter/bin/flutter" --version

      - name: Pub get
        run: flutter pub get

      - name: Build Linux
        run: flutter build linux --release --no-pub

      - name: Package .tar.gz
        run: tar -zcvf piliplus_linux_arm64.tar.gz -C build/linux/arm64/release/bundle .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux_arm64_targz
          path: build/linux/*/release/*.tar.gz
